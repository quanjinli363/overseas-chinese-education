<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>被遗忘的救国火种 · 南洋华侨抗日记忆</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0a0a0a;
  --dark: #141414;
  --gray: #8a8a8a;
  --light-gray: #b0b0b0;
  --border: #2a2a2a;
  --bg: #0a0a0a;
  --bg-overlay: rgba(10,10,10,0.88);
  --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-serif: 'Noto Serif SC', 'Songti SC', serif;
  --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: #fff;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}

/* Page load transition */
body {
  opacity: 0;
  animation: pageLoad 1s var(--transition-smooth) forwards;
}

@keyframes pageLoad {
  to { opacity: 1; }
}

/* ==================== Full-screen Hero ==================== */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 6rem 2rem;
  overflow: hidden;
}

/* Background map image */
.hero-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('static/img/南洋地图.jpg');
  background-size: cover;
  background-position: center 40%;
  opacity: 0.18;
  z-index: 0;
  filter: grayscale(30%) sepia(10%);
}

/* Dark overlay for better text readability */
.hero-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    180deg,
    rgba(10,10,10,0.85) 0%,
    rgba(10,10,10,0.7) 40%,
    rgba(10,10,10,0.75) 70%,
    rgba(10,10,10,0.9) 100%
  );
  z-index: 1;
}

/* Content */
.hero-content {
  position: relative;
  z-index: 2;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Decorative line above title */
.hero-deco-line {
  width: 60px;
  height: 1px;
  background: var(--gray);
  margin-bottom: 2.5rem;
  opacity: 0;
  animation: fadeInUp 1s var(--transition-smooth) 0.3s forwards;
}

/* Main title */
.hero-title {
  font-family: var(--font-serif);
  font-size: clamp(2.8rem, 6vw, 5rem);
  font-weight: 700;
  letter-spacing: 0.1em;
  line-height: 1.2;
  margin-bottom: 0.75rem;
  color: #fff;
  opacity: 0;
  animation: fadeInUp 1.2s var(--transition-smooth) 0.5s forwards;
}

/* Subtitle */
.hero-subtitle {
  font-family: var(--font-serif);
  font-size: clamp(1.1rem, 2.5vw, 1.5rem);
  font-weight: 400;
  letter-spacing: 0.3em;
  color: var(--light-gray);
  margin-bottom: 3rem;
  opacity: 0;
  animation: fadeInUp 1.2s var(--transition-smooth) 0.7s forwards;
}

/* Divider */
.hero-divider {
  width: 40px;
  height: 1px;
  background: var(--gray);
  margin-bottom: 3rem;
  opacity: 0;
  animation: fadeInUp 1s var(--transition-smooth) 0.9s forwards;
}

/* Intro text */
.hero-intro {
  font-family: var(--font-serif);
  font-size: clamp(0.88rem, 1.5vw, 1rem);
  line-height: 2.2;
  color: var(--light-gray);
  max-width: 640px;
  text-align: justify;
  text-align-last: center;
  margin-bottom: 3.5rem;
  opacity: 0;
  animation: fadeInUp 1.2s var(--transition-smooth) 1.1s forwards;
}

.hero-intro .quote {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  color: #fff;
  font-weight: 500;
  display: block;
  margin-bottom: 1.5rem;
  letter-spacing: 0.05em;
}

/* CTA Button */
.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1.1rem 3rem;
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 400;
  letter-spacing: 0.15em;
  transition: all 0.5s var(--transition-smooth);
  background: transparent;
  opacity: 0;
  animation: fadeInUp 1.2s var(--transition-smooth) 1.4s forwards;
  cursor: pointer;
}

.hero-cta:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.6);
  letter-spacing: 0.2em;
}

.hero-cta span {
  transition: transform 0.3s var(--transition-smooth);
}

.hero-cta:hover span {
  transform: translateX(6px);
}

/* Scroll indicator */
.scroll-indicator {
  position: absolute;
  bottom: 2.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  opacity: 0;
  animation: fadeIn 1.5s var(--transition-smooth) 2s forwards;
}

.scroll-indicator span {
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  color: var(--gray);
  text-transform: uppercase;
}

.scroll-indicator .scroll-line {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, var(--gray), transparent);
  animation: scrollPulse 2s ease-in-out infinite;
}

/* Animations */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes scrollPulse {
  0%, 100% { opacity: 0.3; transform: scaleY(1); }
  50% { opacity: 1; transform: scaleY(1.2); }
}

/* Responsive */
@media (max-width: 768px) {
  .hero {
    padding: 5rem 1.5rem;
    min-height: 100svh;
  }
  .hero-title {
    font-size: 2.2rem;
    letter-spacing: 0.06em;
  }
  .hero-subtitle {
    font-size: 1rem;
    letter-spacing: 0.2em;
  }
  .hero-intro {
    font-size: 0.85rem;
    line-height: 2;
    text-align: left;
    text-align-last: left;
  }
  .hero-cta {
    padding: 1rem 2rem;
    font-size: 0.85rem;
  }
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  
  <div class="hero-content">
    <div class="hero-deco-line"></div>
    
    <h1 class="hero-title">被遗忘的救国火种</h1>
    <p class="hero-subtitle">南洋华侨抗日记忆</p>
    
    <div class="hero-divider"></div>
    
    <p class="hero-intro">
      <span class="quote">国破山河在，恨别鸟惊心。</span>
      回望长达7年的抗日战争经历，有一群人的身影会被历史忽略，但他们的故事却令人动容。他们或许早早离开中国国土；或许始终没有机会返回故乡；他们或许为生计所迫做着最辛苦的工作；或许在异国他乡靠着自己的毅力搏得立身之所。这群人便是南洋华侨，占据当时华侨总人口的95%。抗日战争爆发后，即使远在千里之外，他们依然倾尽自己的力量支持抗战，他们认为："如果祖国倒下，那根和祖国相连的线就断了。"秉承着这样的观念，南洋华侨在近代史进程中做了许多救国于水火的义举，被孙中山先生誉为"革命之母"。
    </p>
    
    <a href="#" class="hero-cta" onclick="return false;">
      回望南洋华侨革命史 <span>→</span>
    </a>
  </div>
  
  <div class="scroll-indicator">
    <span>Scroll</span>
    <div class="scroll-line"></div>
  </div>
</section>

</body>
</html>
